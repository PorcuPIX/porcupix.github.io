# Butterfly theme overrides

nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: true

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  GitHub: https://github.com/PorcuPIX || fab fa-github

social:
  fab fa-github: https://github.com/PorcuPIX || GitHub || '#24292e'

favicon: /img/favicon.ico

avatar:
  img: /img/avatar.png
  effect: false

disable_top_img: false
default_top_img:
index_img:
archive_img:
tag_img:
category_img:
footer_img: false
background:

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:

subtitle:
  enable: true
  effect: true
  typed_option:
  source: false
  sub:
    - 给我高高的飞起来啊

index_layout: 3
index_post_content:
  method: 3
  length: 300

code_blocks:
  theme: light
  macStyle: true
  height_limit: false
  word_wrap: true
  copy: true
  language: true
  shrink: false
  fullpage: false

toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href: https://github.com/PorcuPIX
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

post_edit:
  enable: false
  url:

related_post:
  enable: true
  limit: 6
  date_type: created

post_pagination: 1

noticeOutdate:
  enable: true
  style: flat
  limit_day: 365
  position: top
  message_prev: 距离上次更新已经
  message_next: 天，文章内容可能已经过时。

footer:
  nav:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: true
    version: true
  custom_text: 'Powered by Hexo & Butterfly'

aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: Keep Learning, Keep Coding
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/PorcuPIX
  card_announcement:
    enable: true
    content: 欢迎来到 PorcuPIX 的个人博客。
  card_recent_post:
    enable: true
    limit: 5
    sort: date
    sort_order:
  card_newest_comments:
    enable: false
  card_categories:
    enable: true
    limit: 8
    expand: none
    sort_order:
  card_tags:
    enable: true
    limit: 40
    color: false
    orderby: random
    order: 1
    sort_order:
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
    sort_order:
  card_post_series:
    enable: true
    series_title: false
    orderBy: date
    order: -1
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    sort_order:
    runtime_date: 05/27/2026 00:00:00

readmode: true

darkmode:
  enable: true
  button: true
  autoChangeMode: false
  start:
  end:

rightside_scroll_percent: true

copy:
  enable: true
  copyright:
    enable: false
    limit_count: 150

busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

search:
  use:
  placeholder: 搜索文章

share:
  use:

comments:
  use:
  text: true
  lazyload: false
  count: false
  card_post_count: false

display_mode: light

rounded_corners_ui: true
text_align_justify: false

mask:
  header: true
  footer: true

preloader:
  enable: false

enter_transitions: true

beautify:
  enable: true
  field: post
  title_prefix_icon:
  title_prefix_icon_color:

hr_icon:
  enable: true
  icon:
  icon_top:

lightbox: fancybox

pjax:
  enable: false

snackbar:
  enable: false

lazyload:
  enable: true
  native: true
  field: site
  placeholder:
  blur: false

Open_Graph_meta:
  enable: true

CDN:
  internal_provider: local
  third_party_provider: jsdelivr
  version: true
  custom_format:
